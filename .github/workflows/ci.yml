name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=recoverypilot --cov-report=term-missing
      - name: Smoke test the CLI on the synthetic samples
        run: |
          recoverypilot triage examples/*.csv examples/*.json \
            --config examples/config.example.yaml \
            --as-of 2026-10-20T08:00:00Z --llm \
            --json-out reports/triage.json --md-out reports/triage.md
      - name: Upload sample report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: sample-triage-report
          path: reports/
